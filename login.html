<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheHyenaHub — Executive Portal Login</title>
  <meta name="description" content="Modern glassmorphic React login application for The Hyena Hub secure executive portal.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN (v3) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0A0A0C',
            charcoal: '#121215',
            gold: {
              DEFAULT: '#D4B44A',
              bright: '#F3E5AB',
              muted: 'rgba(212, 175, 55, 0.2)'
            },
            lavender: {
              DEFAULT: '#DDD6FE',
              soft: '#E5DEFF',
              dark: '#9333EA'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          animation: {
            'float-slow': 'float 8s ease-in-out infinite alternate',
            'pulse-glow': 'pulseGlow 4s ease-in-out infinite alternate',
            'shimmer': 'shimmer 2.5s infinite',
          },
          keyframes: {
            float: {
              '0%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-12px) rotate(1deg)' },
              '100%': { transform: 'translateY(8px) rotate(-1deg)' },
            },
            pulseGlow: {
              '0%': { opacity: '0.3', transform: 'scale(0.98)' },
              '100%': { opacity: '0.6', transform: 'scale(1.05)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0A0A0C;
      color: #F5F5F7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Radial mesh gradient animation */
    .bg-mesh-gradient {
      background: radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(221, 214, 254, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(18, 18, 21, 0.95) 0%, #0A0A0C 100%);
    }

    /* Custom Glassmorphism panel */
    .glass-panel {
      background: rgba(18, 18, 21, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.08);
    }

    /* 3D Glass Emblem Floating Layer */
    .glass-emblem-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .glass-emblem-core {
      width: 180px;
      height: 180px;
      border-radius: 38px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(221, 214, 254, 0.2);
      transform: rotateX(15deg) rotateY(-15deg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .glass-emblem-core::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 46px;
      border: 1px solid rgba(221, 214, 254, 0.2);
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    /* Shimmer Sweep */
    .shimmer-effect {
      position: relative;
      overflow: hidden;
    }
    .shimmer-effect::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: translateX(-100%);
    }
    .shimmer-effect:hover::after {
      animation: shimmer 1.5s ease-in-out infinite;
    }

    /* Custom Floating Label Inputs */
    .floating-label-group {
      position: relative;
    }
    .floating-input {
      width: 100%;
      background: rgba(18, 18, 21, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 18px 16px 8px;
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-input:focus, .floating-input:not(:placeholder-shown) {
      border-color: #D4B44A;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      transform: scale(1.01);
    }
    .floating-label {
      position: absolute;
      left: 16px;
      top: 14px;
      color: #9CA3AF;
      font-size: 0.85rem;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-input:focus ~ .floating-label,
    .floating-input:not(:placeholder-shown) ~ .floating-label {
      top: 4px;
      font-size: 0.68rem;
      color: #D4B44A;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- REACT APPLICATION SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ParticleBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = [];
        for (let i = 0; i < 50; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2 + 0.5,
            speedY: -(Math.random() * 0.3 + 0.1),
            speedX: (Math.random() - 0.5) * 0.2,
            alpha: Math.random() * 0.5 + 0.2,
            color: Math.random() > 0.5 ? 'rgba(212, 175, 55, ' : 'rgba(221, 214, 254, '
          });
        }

        let animId;
        const render = () => {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;
            if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color + p.alpha + ')';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(212, 175, 55, 0.3)';
            ctx.fill();
          });
          animId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

    function App() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [keepSignedIn, setKeepSignedIn] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);
      const [mounted, setMounted] = useState(false);

      useEffect(() => {
        setMounted(true);
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        setTimeout(() => {
          setIsSubmitting(false);
          setIsSuccess(true);
        }, 1200);
      };

      return (
        <div className="relative min-h-screen w-full flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-mesh-gradient overflow-hidden">
          <ParticleBackground />

          {/* MAIN SPLIT-SCREEN GLASS CONTAINER */}
          <main className={`relative z-10 w-full max-w-5xl glass-panel rounded-3xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 transition-all duration-1000 transform ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
            
            {/* HERO VISUAL COLUMN (LEFT / 50% DESKTOP) */}
            <div className="lg:col-span-6 p-8 lg:p-12 flex flex-col justify-between relative bg-gradient-to-br from-white/5 to-transparent border-b lg:border-b-0 lg:border-r border-gold/15">
              
              {/* Top Brand Link */}
              <div className="flex items-center gap-3">
                <a href="index.html" className="flex items-center gap-3 group">
                  <img src="assets/images/logo/logo.png" alt="TheHyenaHub Logo" className="w-10 h-10 rounded-full object-cover border border-gold/40 shadow-lg group-hover:scale-105 transition-transform" />
                  <span className="font-serif text-xl font-bold text-white tracking-tight">The Hyena <span className="text-gold">Hub</span></span>
                </a>
              </div>

              {/* 3D Floating Glass Emblem */}
              <div className="my-12 flex flex-col items-center justify-center text-center">
                <div className="glass-emblem-wrap animate-float-slow">
                  <div className="glass-emblem-core">
                    <img src="assets/images/logo/logo.png" alt="Hyena Emblem" className="w-24 h-24 rounded-full object-cover shadow-2xl filter drop-shadow-[0_0_15px_rgba(212,175,55,0.5)]" />
                  </div>
                </div>

                <h1 className="mt-8 font-serif text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight">
                  Welcome to <br />
                  <span className="bg-gradient-to-r from-white via-gold to-amber-200 bg-clip-text text-transparent">
                    TheHyenaHub
                  </span>
                </h1>
                
                <p className="mt-4 text-sm text-gray-400 max-w-sm font-light leading-relaxed">
                  Enter your credentials to access the secure executive portal, private screeners, and distribution infrastructure.
                </p>
              </div>

              {/* Bottom Feature Badges */}
              <div className="flex items-center justify-between text-xs text-gray-400 pt-6 border-t border-white/10">
                <span className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  AES-256 Encrypted
                </span>
                <span>FIAPF Certified</span>
              </div>
            </div>

            {/* FORM COLUMN (RIGHT / 50% DESKTOP) */}
            <div className="lg:col-span-6 p-8 lg:p-12 flex flex-col justify-center relative">
              
              {!isSuccess ? (
                <div>
                  {/* Header & Status Indicator */}
                  <div className="flex items-center justify-between mb-8">
                    <div>
                      <span className="text-xs uppercase tracking-widest text-lavender font-semibold">AUTHENTICATION</span>
                      <h2 className="text-2xl font-bold text-white mt-1">Executive Portal</h2>
                    </div>

                    <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                      System Online
                    </div>
                  </div>

                  {/* Form */}
                  <form onSubmit={handleSubmit} className="space-y-6">
                    
                    {/* Floating Label Field 1: Username / Email */}
                    <div className="floating-label-group">
                      <input
                        type="email"
                        id="email"
                        placeholder=" "
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="floating-input"
                      />
                      <label htmlFor="email" className="floating-label">Email / Username</label>
                    </div>

                    {/* Floating Label Field 2: Password */}
                    <div className="floating-label-group">
                      <input
                        type={showPassword ? 'text' : 'password'}
                        id="password"
                        placeholder=" "
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="floating-input pr-12"
                      />
                      <label htmlFor="password" className="floating-label">Password</label>

                      {/* Password Visibility Toggle */}
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-4 top-1/2 -translate-y-1/2 text-lavender/70 hover:text-lavender transition-colors p-1"
                        aria-label="Toggle password visibility"
                      >
                        {showPassword ? (
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
                        ) : (
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        )}
                      </button>
                    </div>

                    {/* Controls Row: Slide Toggle & Forgot Password */}
                    <div className="flex items-center justify-between text-xs pt-1">
                      <label className="flex items-center gap-3 cursor-pointer group select-none">
                        <div
                          onClick={() => setKeepSignedIn(!keepSignedIn)}
                          className={`w-9 h-5 rounded-full p-0.5 transition-colors duration-300 ease-in-out ${keepSignedIn ? 'bg-gold' : 'bg-gray-700'}`}
                        >
                          <div className={`w-4 h-4 rounded-full bg-obsidian transition-transform duration-300 ease-in-out ${keepSignedIn ? 'translate-x-4' : 'translate-x-0'}`} />
                        </div>
                        <span className="text-gray-400 group-hover:text-gray-300 transition-colors">Keep me signed in</span>
                      </label>

                      <a href="#" className="text-gold hover:text-gold-bright transition-colors relative after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-0 after:h-px after:bg-gold hover:after:w-full after:transition-all">
                        Forgot Password?
                      </a>
                    </div>

                    {/* Primary Button */}
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className={`w-full py-4 px-6 rounded-xl font-bold uppercase tracking-wider text-obsidian bg-gold hover:bg-gold-bright shadow-lg shadow-gold/25 transition-all duration-300 shimmer-effect flex items-center justify-center gap-2 ${isSubmitting ? 'animate-pulse opacity-80' : 'hover:-translate-y-0.5'}`}
                    >
                      {isSubmitting ? (
                        <>
                          <span className="w-5 h-5 border-2 border-obsidian border-t-transparent rounded-full animate-spin"></span>
                          Verifying Access...
                        </>
                      ) : (
                        <>
                          Sign In &rarr;
                        </>
                      )}
                    </button>
                  </form>

                  {/* Social Logins Divider */}
                  <div className="relative my-8 text-center">
                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/10"></div></div>
                    <span className="relative px-4 text-xs uppercase tracking-widest text-gray-500 bg-[#121215]">OR SIGN IN WITH</span>
                  </div>

                  {/* Social Pill Buttons */}
                  <div className="grid grid-cols-2 gap-4">
                    <button type="button" className="py-2.5 px-4 rounded-full border border-white/15 bg-white/5 hover:border-gold hover:text-gold text-xs font-medium text-gray-300 transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                      Passkey
                    </button>
                    
                    <button type="button" className="py-2.5 px-4 rounded-full border border-white/15 bg-white/5 hover:border-gold hover:text-gold text-xs font-medium text-gray-300 transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5">
                      <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                      SSO Login
                    </button>
                  </div>
                </div>
              ) : (
                /* SUCCESS RIPPLE STATE */
                <div className="text-center py-8 animate-fade-in">
                  <div className="w-20 h-20 rounded-full bg-gold/20 border-2 border-gold text-gold flex items-center justify-center text-3xl mx-auto mb-6 shadow-[0_0_40px_rgba(212,175,55,0.5)]">
                    ✦
                  </div>

                  <h3 className="font-serif text-3xl font-bold text-white mb-2">Access Granted</h3>
                  <p className="text-sm text-gray-400 max-w-sm mx-auto mb-8">
                    Welcome back to TheHyenaHub Executive Portal. Redirecting to your private theater dashboard...
                  </p>

                  <div className="p-4 rounded-xl bg-white/5 border border-gold/30 mb-8 max-w-xs mx-auto">
                    <span className="text-[10px] uppercase tracking-widest text-gray-400 block mb-1">SESSION TOKEN</span>
                    <span className="font-mono text-sm text-gold font-bold">AUTH-HYN-2026-OK</span>
                  </div>

                  <div className="flex gap-4 justify-center">
                    <a href="portfolio.html#theater" className="py-3 px-6 rounded-xl bg-gold text-obsidian font-bold text-xs uppercase tracking-wider hover:bg-gold-bright transition-colors">
                      Open Private Theater
                    </a>
                    <a href="index.html" className="py-3 px-6 rounded-xl border border-gold/40 text-white font-bold text-xs uppercase tracking-wider hover:bg-gold/10 transition-colors">
                      Home Page
                    </a>
                  </div>
                </div>
              )}

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
