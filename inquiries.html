<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Dispatch Console — The Hyena Hub</title>
  <meta name="description" content="Studio-grade interactive email & executive dispatch console for film acquisition, co-production, and direct studio messaging at The Hyena Hub.">
  
  <!-- Google Fonts (Space Grotesk, Inter, Playfair Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN (v3) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#060608',
            indigo: {
              cyber: '#4F46E5',
            },
            champagne: {
              DEFAULT: '#F59E0B',
              bright: '#FDE047',
              gold: '#D4B44A'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            space: ['"Space Grotesk"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          animation: {
            'float-slow-1': 'floatSphere1 14s ease-in-out infinite alternate',
            'float-slow-2': 'floatSphere2 18s ease-in-out infinite alternate',
            'shimmer': 'shimmer 2.5s infinite',
            'wave-pulse': 'wavePulse 2s ease-in-out infinite',
          },
          keyframes: {
            floatSphere1: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(60px, 80px) scale(1.15)' },
              '100%': { transform: 'translate(-40px, 40px) scale(0.95)' },
            },
            floatSphere2: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(-80px, -60px) scale(1.2)' },
              '100%': { transform: 'translate(50px, -30px) scale(0.9)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' }
            },
            wavePulse: {
              '0%, 100%': { border: '1px dashed rgba(245, 158, 11, 0.3)', opacity: 0.7 },
              '50%': { border: '1px dashed rgba(245, 158, 11, 0.9)', opacity: 1 },
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #060608;
      color: #F3F4F6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* High-blur Glassmorphism */
    .glass-console-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
    }

    /* Holographic Memo Card */
    .holographic-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(79, 70, 229, 0.08) 50%, rgba(245, 158, 11, 0.05) 100%);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 40px rgba(79, 70, 229, 0.15), inset 0 0 25px rgba(255, 255, 255, 0.03);
    }

    /* Shimmer Effect */
    .shimmer-btn-wrap {
      position: relative;
      overflow: hidden;
    }
    .shimmer-btn-wrap::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: translateX(-100%);
    }
    .shimmer-btn-wrap:hover::after {
      animation: shimmer 1.5s ease-in-out infinite;
    }

    /* Floating Inputs */
    .floating-field-wrap {
      position: relative;
    }
    .console-input {
      width: 100%;
      background: rgba(10, 10, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 20px 16px 8px;
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .console-input:focus {
      border-color: #F59E0B;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
      transform: scale(1.008);
      background: rgba(18, 18, 22, 0.8);
    }
    .console-label {
      position: absolute;
      left: 16px;
      top: 15px;
      color: #9CA3AF;
      font-size: 0.85rem;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .console-input:focus ~ .console-label,
    .console-input:not(:placeholder-shown) ~ .console-label {
      top: 5px;
      font-size: 0.68rem;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Typewriter Caret */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #F59E0B;
      margin-left: 2px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/logo/logo.png" alt="The Hyena Hub Logo">
        <span class="brand-text">The Hyena <span>Hub</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="services.html" class="nav-link">Services</a></li>
        <li><a href="portfolio.html" class="nav-link">Teaser</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-gold btn-sm">Portal Access</a>
        <a href="inquiries.html" class="btn btn-outline-gold">Direct Inquiries</a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle Navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-drawer" id="mobileDrawer">
    <ul class="mobile-nav-links">
      <li><a href="index.html" class="mobile-nav-link">Home</a></li>
      <li><a href="about.html" class="mobile-nav-link">About Us</a></li>
      <li><a href="services.html" class="mobile-nav-link">Services</a></li>
      <li><a href="portfolio.html" class="mobile-nav-link">Teaser</a></li>
      <li><a href="contact.html" class="mobile-nav-link">Contact</a></li>
    </ul>
    <a href="inquiries.html" class="btn btn-gold" style="width: 100%;">Direct Inquiries</a>
  </div>

  <div id="dispatchRoot"></div>

  <!-- REACT DISPATCH APPLICATION SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function DispatchConsoleApp() {
      const [intent, setIntent] = useState('Executive Partnership');
      const [tone, setTone] = useState('Executive Formal');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [company, setCompany] = useState('');
      const [subject, setSubject] = useState('');
      const [message, setMessage] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [fileName, setFileName] = useState('');
      const [isDispatching, setIsDispatching] = useState(false);
      const [isDispatched, setIsDispatched] = useState(false);
      const [dispatchID, setDispatchID] = useState('');

      const GMAIL_ADDRESS = 'Thehyenahub@gmail.com';

      const handleDispatchSubmit = (e) => {
        e.preventDefault();
        setIsDispatching(true);

        const refCode = `HYN-DISPATCH-${Math.floor(1000 + Math.random() * 9000)}`;
        setDispatchID(refCode);

        const subjectRaw = `[${intent} | ${tone}] ${subject || 'Direct Executive Inquiry'} - from ${name || 'Executive Lead'}`;
        const bodyRaw = `EXECUTIVE MEMO TRANSMISSION\nRef: ${refCode}\nIntent: ${intent}\nTone: ${tone}\nName: ${name}\nEmail: ${email}\nOrganization: ${company || 'N/A'}\n\nMESSAGE:\n${message}\n\n[End Transmission]`;

        const gmailWebUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${GMAIL_ADDRESS}&su=${encodeURIComponent(subjectRaw)}&body=${encodeURIComponent(bodyRaw)}`;

        setTimeout(() => {
          setIsDispatching(false);
          setIsDispatched(true);
          window.open(gmailWebUrl, '_blank');
        }, 1100);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          setFileName(e.dataTransfer.files[0].name);
        }
      };

      return (
        <div className="relative min-h-screen w-full flex items-center justify-center p-4 sm:p-6 lg:p-12 pt-28 pb-16 overflow-hidden">
          
          {/* Dynamic Background Blur Spheres */}
          <div className="absolute top-1/4 left-10 w-96 h-96 rounded-full bg-indigo-cyber/25 blur-[120px] animate-float-slow-1 pointer-events-none z-0" />
          <div className="absolute bottom-1/4 right-10 w-[420px] h-[420px] rounded-full bg-champagne/20 blur-[140px] animate-float-slow-2 pointer-events-none z-0" />

          {/* ASYMMETRIC 60/40 SPLIT SCREEN CONSOLE */}
          <main className="relative z-10 w-full max-w-7xl glass-console-panel rounded-3xl overflow-hidden grid grid-cols-1 lg:grid-cols-12">
            
            {/* LEFT PANEL: DYNAMIC HOLOGRAPHIC EXECUTIVE MEMO (40% DESKTOP) */}
            <div className="lg:col-span-5 p-8 lg:p-10 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-white/10 bg-white/[0.015] relative">
              
              <div>
                {/* Recipient Status Header */}
                <div className="flex items-center justify-between mb-8">
                  <div className="flex items-center gap-3">
                    <img src="assets/images/logo/logo.png" alt="Hyena Emblem" className="w-9 h-9 rounded-full object-cover border border-champagne/40 shadow-lg" />
                    <div>
                      <span className="text-[10px] font-mono tracking-widest text-champagne uppercase font-bold">RECIPIENT DESTINATION</span>
                      <div className="text-sm font-space font-bold text-white">TheHyenaHub Studio</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Live Intake
                  </div>
                </div>

                {/* HOLOGRAPHIC MEMO CARD */}
                <div className="holographic-card rounded-2xl p-6 sm:p-7 relative overflow-hidden">
                  <div className="flex items-center justify-between text-[11px] font-mono text-gray-400 pb-4 mb-5 border-b border-white/10">
                    <span className="text-champagne font-bold">EXECUTIVE DISPATCH MEMO</span>
                    <span>SECURE HASH: {Math.floor(100000 + Math.random() * 900000)}</span>
                  </div>

                  <div className="space-y-4 font-mono text-xs">
                    <div>
                      <span className="text-gray-500 uppercase tracking-widest text-[10px] block mb-0.5">INTENT TAG</span>
                      <span className="px-2.5 py-1 rounded-md bg-champagne/15 border border-champagne/30 text-champagne font-semibold inline-block">
                        {intent}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <span className="text-gray-500 uppercase tracking-widest text-[10px] block mb-0.5">SENDER NAME</span>
                        <span className="text-white font-medium">{name || <span className="text-gray-600 font-normal">Awaiting Input...</span>}</span>
                      </div>
                      <div>
                        <span className="text-gray-500 uppercase tracking-widest text-[10px] block mb-0.5">SENDER EMAIL</span>
                        <span className="text-white font-medium truncate block">{email || <span className="text-gray-600 font-normal">Awaiting Email...</span>}</span>
                      </div>
                    </div>

                    <div>
                      <span className="text-gray-500 uppercase tracking-widest text-[10px] block mb-0.5">SUBJECT</span>
                      <span className="text-champagne-bright font-space font-semibold text-sm block">{subject || 'Executive Transmission Subject'}</span>
                    </div>

                    <div>
                      <span className="text-gray-500 uppercase tracking-widest text-[10px] block mb-1">LIVE MEMO BODY ({tone})</span>
                      <div className="p-3.5 rounded-xl bg-black/40 border border-white/10 text-gray-200 text-xs font-sans leading-relaxed min-h-[110px]">
                        {message ? (
                          <>
                            {message}
                            <span className="typewriter-cursor"></span>
                          </>
                        ) : (
                          <span className="text-gray-600 italic">Type your memo on the right workspace to render live character preview...</span>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Attached File Indicator */}
                  {fileName && (
                    <div className="mt-4 pt-3 border-t border-white/10 flex items-center justify-between text-xs text-champagne font-mono">
                      <span>📎 ATTACHED: {fileName}</span>
                      <span className="text-[10px] text-emerald-400">READY</span>
                    </div>
                  )}
                </div>
              </div>

              {/* Bottom Security Info */}
              <div className="mt-8 pt-6 border-t border-white/10 flex items-center justify-between text-xs text-gray-400 font-mono">
                <span>DIRECT MAILBOX: Thehyenahub@gmail.com</span>
                <span>ENC: AES-256</span>
              </div>
            </div>

            {/* RIGHT PANEL: INTERACTION WORKSPACE (60% DESKTOP) */}
            <div className="lg:col-span-7 p-8 lg:p-12 flex flex-col justify-between relative">
              
              {!isDispatched ? (
                <div>
                  <div className="mb-6">
                    <span className="text-xs uppercase tracking-widest text-champagne font-mono font-bold">DIRECT INTERACTION STUDIO</span>
                    <h1 className="font-space text-3xl sm:text-4xl font-bold text-white mt-1">Executive Dispatch Console</h1>
                  </div>

                  {/* SMART INTENT CATEGORY BADGES */}
                  <div className="mb-7">
                    <label className="text-xs font-mono text-gray-400 uppercase tracking-wider block mb-2.5">MESSAGE INTENT</label>
                    <div className="flex flex-wrap gap-2.5">
                      {['Executive Partnership', 'Studio Pitch', 'Urgent Direct', 'Private Screener'].map((item) => (
                        <button
                          key={item}
                          type="button"
                          onClick={() => setIntent(item)}
                          className={`px-4 py-2 rounded-full text-xs font-medium transition-all duration-300 ${
                            intent === item
                              ? 'bg-champagne text-obsidian font-bold shadow-[0_0_20px_rgba(245,158,11,0.4)] scale-105'
                              : 'bg-white/5 border border-white/15 text-gray-300 hover:border-champagne/50 hover:text-champagne'
                          }`}
                        >
                          {intent === item && '✦ '}
                          {item}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* INPUT FORM */}
                  <form onSubmit={handleDispatchSubmit} className="space-y-5">
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      {/* Floating Field: Full Name */}
                      <div className="floating-field-wrap">
                        <input
                          type="text"
                          id="senderName"
                          placeholder=" "
                          required
                          value={name}
                          onChange={(e) => setName(e.target.value)}
                          className="console-input"
                        />
                        <label htmlFor="senderName" className="console-label">Your Full Name *</label>
                      </div>

                      {/* Floating Field: Email */}
                      <div className="floating-field-wrap">
                        <input
                          type="email"
                          id="senderEmail"
                          placeholder=" "
                          required
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}
                          className="console-input"
                        />
                        <label htmlFor="senderEmail" className="console-label">Your Email Address *</label>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      {/* Floating Field: Subject */}
                      <div className="floating-field-wrap">
                        <input
                          type="text"
                          id="msgSubject"
                          placeholder=" "
                          required
                          value={subject}
                          onChange={(e) => setSubject(e.target.value)}
                          className="console-input"
                        />
                        <label htmlFor="msgSubject" className="console-label">Transmission Subject *</label>
                      </div>

                      {/* Floating Field: Organization */}
                      <div className="floating-field-wrap">
                        <input
                          type="text"
                          id="senderCompany"
                          placeholder=" "
                          value={company}
                          onChange={(e) => setCompany(e.target.value)}
                          className="console-input"
                        />
                        <label htmlFor="senderCompany" className="console-label">Organization / Studio (Optional)</label>
                      </div>
                    </div>

                    {/* AI TONE SWITCHER */}
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <label className="text-xs font-mono text-gray-400 uppercase tracking-wider">SELECT AI DISPATCH TONE</label>
                      </div>
                      <div className="grid grid-cols-3 gap-2 mb-3">
                        {['Executive Formal', 'Concise Brief', 'Creative Pitch'].map((t) => (
                          <button
                            key={t}
                            type="button"
                            onClick={() => setTone(t)}
                            className={`py-2 px-3 rounded-xl text-xs font-medium text-center transition-all ${
                              tone === t
                                ? 'bg-indigo-cyber/30 border border-indigo-cyber text-white font-bold shadow-[0_0_15px_rgba(79,70,229,0.3)]'
                                : 'bg-white/5 border border-white/10 text-gray-400 hover:text-gray-200'
                            }`}
                          >
                            {t}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Floating Field: Message Area */}
                    <div className="floating-field-wrap">
                      <textarea
                        id="msgBody"
                        rows="4"
                        placeholder=" "
                        required
                        value={message}
                        onChange={(e) => setMessage(e.target.value)}
                        className="console-input resize-none"
                      ></textarea>
                      <label htmlFor="msgBody" className="console-label">Executive Message *</label>
                    </div>

                    {/* ATTACHMENT MAGNETIC DOCK */}
                    <div
                      onDragOver={handleDragOver}
                      onDragLeave={handleDragLeave}
                      onDrop={handleDrop}
                      className={`p-4 rounded-2xl text-center transition-all duration-300 ${
                        isDragging
                          ? 'bg-champagne/15 border-2 border-champagne scale-102'
                          : 'bg-white/[0.02] border border-white/10 hover:border-champagne/40'
                      }`}
                    >
                      <span className="text-xs text-gray-300 font-mono block mb-1">
                        {fileName ? `📎 Attached: ${fileName}` : '📥 Drag & Drop Script Bibles or Pitch Decks Here'}
                      </span>
                      <span className="text-[10px] text-gray-500 uppercase tracking-wider font-mono">Supports PDF, DOCX, MP4, MOV (Up to 50MB)</span>
                    </div>

                    {/* PRIMARY DISPATCH BUTTON */}
                    <div className="shimmer-btn-wrap pt-2">
                      <button
                        type="submit"
                        disabled={isDispatching}
                        className={`w-full py-4 px-8 rounded-xl font-space font-bold uppercase tracking-widest text-obsidian bg-champagne hover:bg-champagne-bright shadow-[0_0_30px_rgba(245,158,11,0.4)] transition-all duration-300 flex items-center justify-center gap-3 ${
                          isDispatching ? 'animate-pulse opacity-80' : 'hover:-translate-y-0.5'
                        }`}
                      >
                        {isDispatching ? (
                          <>
                            <span className="w-5 h-5 border-2 border-obsidian border-t-transparent rounded-full animate-spin"></span>
                            FIRING BEAM TRANSMISSION...
                          </>
                        ) : (
                          <>
                            DISPATCH EXECUTIVE MEMO &rarr;
                          </>
                        )}
                      </button>
                    </div>

                  </form>
                </div>
              ) : (
                {/* DISPATCH SUCCESS SCREEN */}
                <div className="text-center py-12 animate-fade-in">
                  <div className="w-20 h-20 rounded-full bg-champagne/20 border-2 border-champagne text-champagne flex items-center justify-center text-3xl mx-auto mb-6 shadow-[0_0_50px_rgba(245,158,11,0.5)]">
                    ✦
                  </div>

                  <span className="text-xs font-mono uppercase tracking-widest text-champagne font-bold block mb-2">TRANSMISSION SENT</span>
                  <h2 className="font-space text-3xl sm:text-4xl font-bold text-white mb-3">Executive Dispatch Confirmed</h2>
                  <p className="text-sm text-gray-400 max-w-md mx-auto mb-8 font-light">
                    Your executive memo has been compiled and dispatched to <strong className="text-champagne">Thehyenahub@gmail.com</strong>.
                  </p>

                  <div className="p-5 rounded-2xl bg-black/50 border border-champagne/30 mb-8 max-w-sm mx-auto font-mono">
                    <span className="text-[10px] uppercase tracking-widest text-gray-500 block mb-1">DISPATCH REFERENCE CODE</span>
                    <span className="text-base text-champagne-bright font-bold">{dispatchID}</span>
                  </div>

                  <div className="flex gap-4 justify-center">
                    <button
                      type="button"
                      onClick={() => setIsDispatched(false)}
                      className="py-3.5 px-6 rounded-xl bg-champagne text-obsidian font-space font-bold text-xs uppercase tracking-wider hover:bg-champagne-bright transition-all shadow-lg"
                    >
                      Send Another Memo
                    </button>
                    <a
                      href="index.html"
                      className="py-3.5 px-6 rounded-xl border border-white/20 text-white font-space font-bold text-xs uppercase tracking-wider hover:bg-white/10 transition-all"
                    >
                      Return to Home
                    </a>
                  </div>
                </div>
              )}

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('dispatchRoot'));
    root.render(<DispatchConsoleApp />);
  </script>
</body>
</html>
